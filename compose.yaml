services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL : ${DATABASE_URL}
      SECRET_KEY : ${SECRET_KEY}
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workpay

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: